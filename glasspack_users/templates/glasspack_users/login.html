{% extends 'basic.html' %}
{% load static %}
{% block content %}
<div>
    <form method="post">
        {% csrf_token%}
        <input type="hidden" name="next" value="{{ next }}" />
        {{ form.as_p }}
        <button type="submit">Enter</button>
    </form>
    <a href="{% url 'glasspack_users:password_reset' %}">Forgot your password?</a>

    <a href="{% url 'social:begin' 'google-oauth2' %}">Login with Google</a>
</div>
{% endblock %}
