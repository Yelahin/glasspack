{% extends 'basic.html' %}
{% load static %}
{% block content %}
<div class="glass glass-card form-container animate-on-scroll">
    <h2 class="text-center">Set your new password</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary" class="btn-full-width">Set new password</button>
    </form>
</div>
{% endblock %}
