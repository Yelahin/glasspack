{% extends 'basic.html' %}
{% load static %}
{% block content %}
<div>
    <div>
        <h1>Profile</h1>
        <div>
            <form action="post">
                {% csrf_token %}
                {{ form.as_p }}
            </form>
        </div>
    </div>
    {% if not user.social_auth.exists %}
        <a href="{% url 'glasspack_users:password_change'%}">Change password</a>
    {% endif %}
</div>
{% endblock %}
